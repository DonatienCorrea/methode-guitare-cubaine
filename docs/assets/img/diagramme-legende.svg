ight="700" fill="#fff">4</text><text x="196" y="284" text-anchor="middle" font-size="12" fill="#8B8075">auriculaire</text><text x="258" y="262" font-size="12" fill="#8B8075">Le pouce (P) reste derrière le manche,</text><text x="258" y="276" font-size="12" fill="#8B8075">il n'apparaît jamais sur un diagramme.</text></svg>