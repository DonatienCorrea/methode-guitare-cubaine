 de «&#160;Hound Dog&#160;», du <tspan font-style="italic">Bo Diddley beat</tspan>,</text><text x="28" y="250" font-size="12" fill="#4E463E">de presque tout le reggaeton, et de la Habanera de <tspan font-style="italic">Carmen</tspan> de Bizet.</text><text x="28" y="268" font-size="12" fill="#4E463E">Frappe-le sur une table&#160;: <tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#8E3A1E">>PAM . . PAM . . PAM .</tspan> — ça y est, tu as le groove.</text></svg>