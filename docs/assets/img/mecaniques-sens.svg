<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" font-family="Inter, 'DejaVu Sans', sans-serif"><rect width="600" height="190" fill="#FFFFFF"/><text x="14" y="22" font-size="12" font-weight="700" fill="#8E3A1E">TENDRE OU DÉTENDRE&#160;?</text><defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#1C5057"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#B94F2C"/></marker></defs><rect x="60" y="58" width="130" height="26" rx="8" fill="#5C3F27"/><circle cx="125" cy="71" r="18" fill="#D8D2C6" stroke="#4E463E" stroke-width="1.5"/><line x1="112" y1="53" x2="112" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="118" y1="53" x2="118" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="124" y1="53" x2="124" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="130" y1="53" x2="130" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="136" y1="53" x2="136" y2="89" stroke="#9A8C78" stroke-width="2.6"/><path d="M 125 40 A 30 30 0 1 1 96 78" stroke="#1C5057" stroke-width="2.4" fill="none" marker-end="url(#a2)"/><text x="125" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#1C5057">Le son MONTE</text><text x="125" y="137" text-anchor="middle" font-size="12" fill="#8B8075">la corde s'enroule, elle se tend</text><line x1="285" y1="40" x2="285" y2="150" stroke="#D9CDB8"/><rect x="370" y="58" width="130" height="26" rx="8" fill="#5C3F27"/><circle cx="435" cy="71" r="18" fill="#D8D2C6" stroke="#4E463E" stroke-width="1.5"/><line x1="422" y1="53" x2="422" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="428" y1="53" x2="428" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="434" y1="53" x2="434" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="440" y1="53" x2="440" y2="89" stroke="#9A8C78" stroke-width="2.6"/><line x1="446" y1="53" x2="446" y2="89" stroke="#9A8C78" stroke-width="2.6"/><path d="M 435 40 A 30 30 0 1 0 464 78" stroke="#B94F2C" stroke-width="2.4" fill="none" marker-end="url(#a3)"/><text x="435" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#B94F2C">Le son DESCEND</text><text x="435" y="137" text-anchor="middle" font-size="12" fill="#8B8075">la corde se déroule, elle se détend</text><rect x="14" y="152" width="572" height="28" rx="6" fill="#F5EDE0" stroke="#D9CDB8"/><text x="26" y="170" font-size="12" fill="#4E463E"><tspan font-weight="700" fill="#8E3A1E">Règle d'or&#160;:</tspan> arriver à la note <tspan font-style="italic">par en dessous</tspan>. Trop haut&#160;? Redescends dessous, puis remonte.</text></svg>