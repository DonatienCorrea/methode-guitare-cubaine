0" fill="#8E3A1E">À VÉRIFIER</text><text x="410" y="242" font-size="10" fill="#4E463E">· Manche incliné à ~ 45°, tête à hauteur d'épaule</text><text x="410" y="259" font-size="10" fill="#4E463E">· Dos droit mais pas raide, épaules basses</text><text x="410" y="276" font-size="10" fill="#4E463E">· Pied gauche sur le repose-pied (10–18 cm)</text><text x="410" y="293" font-size="10" fill="#4E463E">· Les deux mains sont libres : si tu lâches</text><text x="410" y="310" font-size="10" fill="#4E463E">  tout, la guitare ne bouge pas</text><text x="410" y="348" font-size="9.5" font-style="italic" fill="#8B8075">Pas de repose-pied&#160;? Un gros livre ou</text><text x="410" y="362" font-size="9.5" font-style="italic" fill="#8B8075">un coussin de guitare font l'affaire.</text></svg>