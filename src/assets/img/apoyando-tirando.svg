<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210" font-family="Inter, 'DejaVu Sans', sans-serif"><rect width="560" height="210" fill="#FFFFFF"/><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8E3A1E"/></marker></defs><rect x="14" y="14" width="250" height="182" rx="8" fill="#fff" stroke="#D9CDB8"/><text x="30" y="36" font-size="11.5" font-weight="700" fill="#1C5057">TIRANDO — le jeu « libre »</text><text x="30" y="50" font-size="9.3" fill="#8B8075">le doigt passe au-dessus des autres cordes</text><line x1="36" y1="76" x2="242" y2="76" stroke="#4E463E" stroke-width="1.90"/><line x1="36" y1="93" x2="242" y2="93" stroke="#4E463E" stroke-width="1.65"/><line x1="36" y1="110" x2="242" y2="110" stroke="#4E463E" stroke-width="1.40"/><line x1="36" y1="127" x2="242" y2="127" stroke="#4E463E" stroke-width="1.15"/><path d="M 120 140 C 140 120, 150 100, 152 78" stroke="#1C5057" stroke-width="10" fill="none" stroke-linecap="round" opacity=".9"/><path d="M 152 90 C 160 78, 168 62, 166 46" stroke="#8E3A1E" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><text x="30" y="176" font-size="9.5" fill="#4E463E">→ arpèges, accords. Le doigt part vers la paume.</text><rect x="296" y="14" width="250" height="182" rx="8" fill="#fff" stroke="#D9CDB8"/><text x="312" y="36" font-size="11.5" font-weight="700" fill="#B94F2C">APOYANDO — le jeu « butté »</text><text x="312" y="50" font-size="9.3" fill="#8B8075">le doigt s'appuie sur la corde voisine</text><line x1="318" y1="76" x2="524" y2="76" stroke="#4E463E" stroke-width="1.90"/><line x1="318" y1="93" x2="524" y2="93" stroke="#4E463E" stroke-width="1.65"/><line x1="318" y1="110" x2="524" y2="110" stroke="#4E463E" stroke-width="1.40"/><line x1="318" y1="127" x2="524" y2="127" stroke="#4E463E" stroke-width="1.15"/><path d="M 402 140 C 422 122, 432 104, 434 82" stroke="#B94F2C" stroke-width="10" fill="none" stroke-linecap="round" opacity=".9"/><path d="M 434 78 L 434 100" stroke="#8E3A1E" stroke-width="1.8" fill="none" marker-end="url(#ah)"/><text x="312" y="176" font-size="9.5" fill="#4E463E">→ mélodies, basses puissantes. Son plus rond.</text></svg>