<svg xmlns="http://www.w3.org/2000/svg" width="640" height="166" viewBox="0 0 640 166" font-family="Inter, 'DejaVu Sans', sans-serif"><rect width="640" height="166" fill="#FFFFFF"/><text x="14" y="22" font-size="12" font-weight="700" fill="#8E3A1E">LES SILENCES</text><text x="14" y="38" font-size="12" fill="#8B8075">à chaque note correspond un silence de même durée — le silence fait partie de la musique</text><rect x="24" y="58" width="104" height="92" rx="8" fill="#fff" stroke="#D9CDB8"/><line x1="42" y1="84" x2="110" y2="84" stroke="#D9CDB8" stroke-width="1"/><rect x="67" y="80" width="18" height="8" fill="#1F1B18"/><line x1="62" y1="80" x2="90" y2="80" stroke="#1F1B18" stroke-width="1.2"/><text x="76" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B18">Pause</text><text x="76" y="132" text-anchor="middle" font-size="12" fill="#8B8075">4 temps</text><text x="76" y="145" text-anchor="middle" font-size="12" fill="#8B8075">ronde</text><rect x="148" y="58" width="104" height="92" rx="8" fill="#fff" stroke="#D9CDB8"/><line x1="166" y1="84" x2="234" y2="84" stroke="#D9CDB8" stroke-width="1"/><rect x="191" y="76" width="18" height="8" fill="#1F1B18"/><line x1="186" y1="84" x2="214" y2="84" stroke="#1F1B18" stroke-width="1.2"/><text x="200" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B18">Demi-pause</text><text x="200" y="132" text-anchor="middle" font-size="12" fill="#8B8075">2 temps</text><text x="200" y="145" text-anchor="middle" font-size="12" fill="#8B8075">blanche</text><rect x="272" y="58" width="104" height="92" rx="8" fill="#fff" stroke="#D9CDB8"/><line x1="290" y1="84" x2="358" y2="84" stroke="#D9CDB8" stroke-width="1"/><path d="M 318 68 C 328 74, 318 80, 327 85 C 318 88, 326 94, 331 100" fill="none" stroke="#1F1B18" stroke-width="2.6" stroke-linecap="round"/><text x="324" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B18">Soupir</text><text x="324" y="132" text-anchor="middle" font-size="12" fill="#8B8075">1 temps</text><text x="324" y="145" text-anchor="middle" font-size="12" fill="#8B8075">noire</text><rect x="396" y="58" width="104" height="92" rx="8" fill="#fff" stroke="#D9CDB8"/><line x1="414" y1="84" x2="482" y2="84" stroke="#D9CDB8" stroke-width="1"/><line x1="453" y1="69" x2="446" y2="100" stroke="#1F1B18" stroke-width="2"/><circle cx="445" cy="72" r="3.2" fill="#1F1B18"/><path d="M 445 72 C 452 70, 455 75, 452 78" fill="none" stroke="#1F1B18" stroke-width="2"/><text x="448" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B18">Demi-soupir</text><text x="448" y="132" text-anchor="middle" font-size="12" fill="#8B8075">½ temps</text><text x="448" y="145" text-anchor="middle" font-size="12" fill="#8B8075">croche</text><rect x="520" y="58" width="104" height="92" rx="8" fill="#fff" stroke="#D9CDB8"/><line x1="538" y1="84" x2="606" y2="84" stroke="#D9CDB8" stroke-width="1"/><line x1="577" y1="69" x2="570" y2="100" stroke="#1F1B18" stroke-width="2"/><circle cx="569" cy="72" r="3.2" fill="#1F1B18"/><path d="M 569 72 C 576 70, 579 75, 576 78" fill="none" stroke="#1F1B18" stroke-width="2"/><circle cx="569" cy="83" r="3.2" fill="#1F1B18"/><path d="M 569 83 C 576 81, 579 86, 576 89" fill="none" stroke="#1F1B18" stroke-width="2"/><text x="572" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#1F1B18">Quart de soupir</text><text x="572" y="132" text-anchor="middle" font-size="12" fill="#8B8075">¼ temps</text><text x="572" y="145" text-anchor="middle" font-size="12" fill="#8B8075">double-croche</text></svg>