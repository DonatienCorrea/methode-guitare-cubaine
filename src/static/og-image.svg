<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <clipPath id="c"><rect width="1200" height="630"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="630" fill="#FCFAF6"/>
    <rect width="1200" height="630" fill="none"/>

    <!-- rosace décorative, débordant à droite -->
    <g opacity="0.16">
      <circle cx="1050" cy="315" r="300" fill="none" stroke="#1C5057" stroke-width="3"/>
      <circle cx="1050" cy="315" r="245" fill="none" stroke="#C68B21" stroke-width="10"/>
      <circle cx="1050" cy="315" r="195" fill="none" stroke="#1C5057" stroke-width="3"/>
      <circle cx="1050" cy="315" r="120" fill="#B94F2C"/>
    </g>
    <g opacity="0.22" stroke="#1F1B18" stroke-width="2">
      <line x1="940" y1="0" x2="940" y2="630"/>
      <line x1="1000" y1="0" x2="1000" y2="630"/>
      <line x1="1060" y1="0" x2="1060" y2="630"/>
      <line x1="1120" y1="0" x2="1120" y2="630"/>
      <line x1="1180" y1="0" x2="1180" y2="630"/>
    </g>

    <!-- filet de gauche -->
    <rect x="0" y="0" width="14" height="630" fill="#1C5057"/>

    <g font-family="Century Schoolbook L, DejaVu Serif, serif">
      <text x="96" y="150" font-family="DejaVu Sans, sans-serif" font-size="23"
            letter-spacing="5" fill="#7A6F63">MÉTHODE DE GUITARE CLASSIQUE</text>
      <text x="92" y="286" font-size="112" fill="#1F1B18">Couleurs</text>
      <text x="92" y="404" font-size="112" font-style="italic" fill="#B94F2C">cubaines</text>
      <text x="96" y="480" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#4E463E">
        8 semaines · 20 minutes par jour · cordes nylon
      </text>
    </g>

    <!-- filet tricolore + url -->
    <g>
      <rect x="96" y="529" width="120" height="6" fill="#B94F2C"/>
      <rect x="216" y="529" width="120" height="6" fill="#C68B21"/>
      <rect x="336" y="529" width="120" height="6" fill="#1C5057"/>
      <text x="96" y="580" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#7A6F63">
        donatiencorrea.github.io/methode-guitare-cubaine
      </text>
    </g>
  </g>
</svg>
